- name: Certificates create
  hosts: all
  gather_facts: false
  vars:
    certificates_kubernetes_cluster:
      domain: kubernetes.local
      endpoint: server
  roles:
    - certificates

- name: Basic servers setup
  hosts:
    - servers
  gather_facts: false
  vars:
    server_hosts:
      - 192.168.56.10 server.kubernetes.local
  roles:
    - server

- name: Basic workers setup
  hosts:
    - workers
  gather_facts: false
  vars:
    server_hosts:
      - 192.168.56.10 server.kubernetes.local
    server_custom_packages:
      - socat
      - conntrack
      - ipset
      - kmod
  roles:
    - server

- name: Install etcd
  hosts:
    - etcd
  gather_facts: false
  roles:
    - etcd

- name: Kubernetes install
  gather_facts: false
  hosts:
    - servers
    - workers
  roles:
    - kubernetes
