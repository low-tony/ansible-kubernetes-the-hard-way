- name: Kubernetes | config servers | create ClusterRole for API server
  kubernetes.core.k8s:
    kubeconfig: "{{ kubernetes_kubeconfig_admin_path }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: system:kube-apiserver-to-kubelet
      rules:
        - apiGroups: [""]
          resources:
            - nodes/proxy
            - nodes/stats
            - nodes/log
            - nodes/spec
            - nodes/metrics
          verbs: ["*"]

- name: Kubernetes | config servers | bind ClusterRole to API server user
  kubernetes.core.k8s:
    kubeconfig: "{{ kubernetes_kubeconfig_admin_path }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: system:kube-apiserver
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:kube-apiserver-to-kubelet
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: User
          name: kubernetes
