- name: Etcd | gather facts
  become: true
  ansible.builtin.setup:
  tags:
    - etcd
    - etcd_install

- name: Etcd | import user creation
  become: true
  ansible.builtin.import_tasks:
    file: user.yml
  tags:
    - etcd
    - etcd_install

- name: Etcd | import install
  ansible.builtin.import_tasks:
    file: install.yml
  tags:
    - etcd
    - etcd_install

- name: Etcd | import config
  become: true
  ansible.builtin.import_tasks:
    file: config.yml
  tags:
    - etcd
    - etcd_config

- name: Etcd | import uninstall
  become: true
  ansible.builtin.import_tasks:
    file: uninstall.yml
  when: etcd_uninstall
  tags:
    - etcd
    - etcd_install
    - etcd_uninstall
