- name: Etcd | configs | copy certificates
  ansible.builtin.copy:
    src: "{{ etcd_cerficates_folder }}/{{ item }}"
    dest: "{{ etcd_settings.config_path }}"
    mode: '0640'
    owner: "{{ etcd_settings.user }}"
    group: "{{ etcd_settings.group }}"
  loop:
    - "{{ etcd_certificates.server.key }}"
    - "{{ etcd_certificates.server.crt }}"
    - "{{ etcd_certificates.peer.key }}"
    - "{{ etcd_certificates.peer.crt }}"
    - "{{ etcd_certificates.ca }}"

- name: Etcd | configs | create variable with cluster nodes
  ansible.builtin.set_fact:
    etcd_cluster_nodes: >-
      {{
        groups['servers'] |
        map('extract', hostvars, 'server_hostname') |
        map('regex_replace', '^(.*)$', '\1=https://\1:2380') |
        list
      }}

- name: Etcd | configs | create system services
  ansible.builtin.template:
    src: etcd.service.j2
    dest: "/etc/systemd/system/etcd.service"
    mode: '644'

- name: Etcd | configs | start service
  ansible.builtin.systemd:
    name: etcd
    state: restarted
    enabled: true
    daemon_reload: true
  timeout: 180
  retries: 3
